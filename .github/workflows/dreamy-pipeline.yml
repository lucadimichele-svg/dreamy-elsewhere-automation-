name: Dreamy Elsewhere — Prepare and verify

# Manual test mode. Daily scheduling will be enabled once both the image
# source and licensed audio/publishing route actually work.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dreamy-elsewhere-queue
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Check Python and configured Reel slots
        run: |
          python -m compileall -q src
          python - <<'PY'
          import sys
          from datetime import date
          sys.path.insert(0, "src")
          from schedule import slots_for, CONFIG
          assert len(slots_for(date(2026,11,17))) == 4
          assert len(slots_for(date(2026,12,15))) == 2
          assert CONFIG["account"] == "dreamy_elsewhere"
          print("Verified four daily boost slots, two later slots, correct Instagram target.")
          PY
      - name: Render only complete five-image sets
        run: python src/render.py --start "$(TZ=Europe/Berlin date +%F)" --days 9
      - name: Save new media
        run: |
          git config user.name dreamy-elsewhere-bot
          git config user.email dreamy-elsewhere-bot@users.noreply.github.com
          git add docs/media
          if ! git diff --cached --quiet; then
            git commit -m "chore: render Dreamy Elsewhere clips"
            git pull --rebase origin main
            git push
          fi
      - name: Verify Buffer only; publishing disabled unless explicitly configured
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: python src/publish.py
