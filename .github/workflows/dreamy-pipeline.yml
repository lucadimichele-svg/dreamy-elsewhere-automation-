name: Dreamy Elsewhere — Import and render (no publishing)

# Automatically react to five-image Drive manifests once provided.
# This workflow renders media only. Buffer publishing is owned separately.
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/drive_manifests/*.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dreamy-elsewhere-queue
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Check Python and configured Reel slots
        run: |
          python -m compileall -q src
          python - <<'PY'
          import sys
          from datetime import date
          sys.path.insert(0, "src")
          from schedule import slots_for, CONFIG
          assert len(slots_for(date(2026,11,17))) == 4
          assert len(slots_for(date(2026,12,15))) == 2
          assert CONFIG["account"] == "dreamy_elsewhere"
          print("Verified four daily boost slots, two later slots, correct Instagram target.")
          PY
      - name: Import five images from private Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: python src/private_drive_import.py --start "$(TZ=Europe/Berlin date +%F)" --days 9
      - name: Retrieve approved soundtrack from private Google Drive
        env:
          DREAMY_DRIVE_AUDIO_ID: '1epXkgSoT41uTYpFUB0bC4r_ADrViBuOP'
          DREAMY_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: python src/fetch_licensed_audio.py
      - name: Render only complete five-image sets
        run: python src/render.py --start "$(TZ=Europe/Berlin date +%F)" --days 9
      - name: Save new media
        run: |
          git config user.name dreamy-elsewhere-bot
          git config user.email dreamy-elsewhere-bot@users.noreply.github.com
          git add docs/media
          if ! git diff --cached --quiet; then
            git commit -m "chore: render Dreamy Elsewhere clips"
            git pull --rebase origin main
            git push
          fi
      - name: Keep publishing disabled in the renderer
        run: "echo 'DRY RUN / RENDER ONLY: no Buffer API or Instagram publishing in this workflow.'"
