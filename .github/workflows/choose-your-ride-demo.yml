name: Dreamy Elsewhere — Choose Your Ride Reel demo (no publishing)

on:
  push:
    paths:
      - 'tools/choose_your_ride_demo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-ebgaramond fonts-dejavu-core
          python -m pip install pillow requests google-auth
      - name: Assemble five distinct original images into local MP4 demo only
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: python tools/choose_your_ride_demo.py
      - name: Commit only the self-contained sample video and cover
        run: |
          git config user.name dreamy-elsewhere-bot
          git config user.email dreamy-elsewhere-bot@users.noreply.github.com
          git add docs/demos/choose_your_ride_15s.mp4 docs/demos/choose_your_ride_cover.jpg docs/demos/choose_your_ride_details.json
          git diff --cached --quiet && exit 0
          git commit -m "demo: 15s Choose Your Ride Reel preview (not published)"
          git pull --rebase origin main
          git push
      - name: Publishing explicitly disabled
        run: echo 'This is an isolated concept preview, not a Buffer queue or Instagram post.'
