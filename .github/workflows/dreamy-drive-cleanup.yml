name: Dreamy Elsewhere — Safe Drive source cleanup

# Separate from production and Buffer publishing. Never runs on video manifests.
# Triggered after hourly Buffer receipt export. Push runs are DRY-RUN only.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply confirmed publication cleanup (otherwise dry run)"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/drive_cleanup.py'
      - '.github/workflows/dreamy-drive-cleanup.yml'

permissions:
  contents: read

concurrency:
  group: dreamy-elsewhere-private-drive-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Drive verification dependencies
        run: python -m pip install "requests>=2.32,<3" "google-auth>=2,<3"
      - name: Verify access and receipt eligibility WITHOUT changing Drive
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.apply)
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: python src/drive_cleanup.py
      - name: Move confirmed originals to used; delete after 24h in used
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply)
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: python src/drive_cleanup.py --apply
